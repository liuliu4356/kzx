global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # ============ Prometheus 自身 ============
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ============ 北京东坝机房 ============
  # 管理节点 (OMM/RDB/MDS/CM/PM)
  - job_name: 'dongba-omm'
    static_configs:
      - targets: ['node-exporter-1:9100']
        labels:
          datacenter: 北京东坝
          role: OMM
          component: management
          ip: 25.131.185.181
      - targets: ['node-exporter-2:9100']
        labels:
          datacenter: 北京东坝
          role: OMM
          component: management
          ip: 25.131.185.182

  # GTM 节点 (全局事务管理)
  - job_name: 'dongba-gtm'
    static_configs:
      - targets: ['node-exporter-3:9100']
        labels:
          datacenter: 北京东坝
          role: GTM
          component: transaction
          ip: 25.131.185.183
          priority: standby
      - targets: ['node-exporter:9100']
        labels:
          datacenter: 北京东坝
          role: GTM
          component: transaction
          ip: 25.131.185.184
          priority: standby
      - targets: ['node-exporter-1:9100']
        labels:
          datacenter: 北京东坝
          role: GTM
          component: transaction
          ip: 25.131.185.185
          priority: standby

  # DBProxy 代理 (89个实例)
  - job_name: 'dongba-dbproxy'
    static_configs:
      - targets: ['nginx-exporter-1:9113']
        labels:
          datacenter: 北京东坝
          role: DBProxy
          component: proxy
          type: auth
          ip_range: 25.131.185.186-200

  # DB 数据库节点 (80台)
  - job_name: 'dongba-db'
    static_configs:
      - targets: ['mysql-exporter-1:9104']
        labels:
          datacenter: 北京东坝
          role: DB
          component: database
          ip_range: 25.131.185.101-140

  # ============ 北京南法信机房 ============
  - job_name: 'nanfaxin-omm'
    static_configs:
      - targets: ['postgres-exporter-1:9187']
        labels:
          datacenter: 北京南法信
          role: OMM
          component: management
          ip: 26.131.185.181
          vip: 26.131.185.100

  - job_name: 'nanfaxin-gtm'
    static_configs:
      - targets: ['redis-exporter-1:9121']
        labels:
          datacenter: 北京南法信
          role: GTM
          component: transaction
          ip: 26.131.185.183
          priority: primary

  - job_name: 'nanfaxin-db'
    static_configs:
      - targets: ['mysqld-exporter-1:9104']
        labels:
          datacenter: 北京南法信
          role: DB
          component: database
          ip_range: 26.131.185.141-180
          cluster: g1-940

  # ============ 合肥机房 (灾备) ============
  - job_name: 'hefei-omm'
    static_configs:
      - targets: ['logstash:9600']
        labels:
          datacenter: 合肥
          role: OMM
          component: management
          ip: 27.130.52.141
          vip: 27.130.52.100
          type: dr

  - job_name: 'hefei-gtm'
    static_configs:
      - targets: ['elasticsearch:9200']
        labels:
          datacenter: 合肥
          role: GTM
          component: transaction
          ip: 27.130.52.143
          type: dr

  - job_name: 'hefei-dbproxy'
    static_configs:
      - targets: ['nginx-exporter-1:9113']
        labels:
          datacenter: 合肥
          role: DBProxy
          component: proxy
          dbproxy_type: auth
          ip_range: 27.130.52.145-155
          type: dr

  - job_name: 'hefei-db'
    static_configs:
      - targets: ['postgres-exporter-1:9187']
        labels:
          datacenter: 合肥
          role: DB
          component: database
          ip_range: 27.130.52.101-140
          deploy_mode: 双实例部署
          type: dr

  # ============ 公共组件 ============
  # Elasticsearch 监控
  - job_name: 'elasticsearch'
    metrics_path: '/_prometheus/metrics'
    static_configs:
      - targets: ['elasticsearch:9200']
        labels:
          service: elasticsearch

  # Logstash 监控
  - job_name: 'logstash'
    metrics_path: '/_node/stats'
    static_configs:
      - targets: ['logstash:9600']
        labels:
          service: logstash

  # Kibana 监控
  - job_name: 'kibana'
    static_configs:
      - targets: ['kibana:5601']
        labels:
          service: kibana

  # Prometheus 自身监控
  - job_name: 'prometheus-self'
    static_configs:
      - targets: ['prometheus:9090']
        labels:
          service: prometheus

  # ============ 模拟异常指标 (测试用) ============
  - job_name: 'mock-anomaly'
    static_configs:
      - targets: ['mock-metrics:9100']
        labels:
          datacenter: 测试
          role: mock
          purpose: anomaly-test