global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 服务器 1 - Web Server (Node + MySQL + Redis)
  - job_name: 'node-1'
    static_configs:
      - targets: ['node-exporter-1:9100']
        labels:
          server: node-1
          role: web-server
          env: production

  - job_name: 'mysql-1'
    static_configs:
      - targets: ['mysqld-exporter-1:9104']
        labels:
          server: node-1
          service: mysql

  - job_name: 'redis-1'
    static_configs:
      - targets: ['redis-exporter-1:9121']
        labels:
          server: node-1
          service: redis

  # 服务器 2 - API Server (Node + Nginx)
  - job_name: 'node-2'
    static_configs:
      - targets: ['node-exporter-2:9100']
        labels:
          server: node-2
          role: api-server
          env: production

  - job_name: 'nginx-1'
    static_configs:
      - targets: ['nginx-exporter-1:9113']
        labels:
          server: node-2
          service: nginx

  # 服务器 3 - Database Server (Node + PostgreSQL)
  - job_name: 'node-3'
    static_configs:
      - targets: ['node-exporter-3:9100']
        labels:
          server: node-3
          role: database-server
          env: production

  - job_name: 'postgres-1'
    static_configs:
      - targets: ['postgres-exporter-1:9187']
        labels:
          server: node-3
          service: postgresql

  # Elasticsearch 监控
  - job_name: 'elasticsearch'
    metrics_path: '/_prometheus/metrics'
    static_configs:
      - targets: ['elasticsearch:9200']

  # Logstash 监控
  - job_name: 'logstash'
    metrics_path: '/_node/stats'
    static_configs:
      - targets: ['logstash:9600']