input {
  beats {
    port => 5044
  }
  http {
    port => 8080
  }
}

filter {
  if [fields][server] {
    mutate {
      add_field => { "server_name" => "%{fields[server]}" }
    }
  }
  if [fields][role] {
    mutate {
      add_field => { "server_role" => "%{fields[role]}" }
    }
  }
  grok {
    match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{GREEDYDATA:log_message}" }
  }
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "server-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}