prometheus:
  url: http://localhost:9090
  timeout_sec: 10
  queries:

    # ── 系统资源（node_exporter）──────────────────────────────────────────
    - name: cpu_usage
      promql: '100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)'
      threshold: 10           # GDB 要求 <10%（凌晨批处理期间放宽见 batch_windows）
      unit: '%'

    - name: memory_usage
      promql: '(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100'
      threshold: 60           # GDB 要求 <60%
      unit: '%'

    - name: system_load_per_core
      promql: 'node_load5 / count without(cpu,mode)(node_cpu_seconds_total{mode="idle"})'
      threshold: 0.5          # 等价于 64核机器 load5 < 32
      unit: ''

    - name: network_throughput_mbps
      promql: 'max by(instance) (rate(node_network_receive_bytes_total[5m]) + rate(node_network_transmit_bytes_total[5m])) / 1024 / 1024 * 8'
      threshold: 100
      unit: 'Mb/s'

    - name: disk_io_latency_ms
      promql: 'max by(instance) (rate(node_disk_io_time_seconds_total[5m])) * 1000'
      threshold: 100          # 正常应为 5ms 级别，100ms 为告警线
      unit: 'ms'

    - name: disk_usage_data
      promql: '(1 - node_filesystem_avail_bytes{mountpoint="/data"} / node_filesystem_size_bytes{mountpoint="/data"}) * 100'
      threshold: 80           # GDB 要求 <80%
      unit: '%'

    # ── 数据库性能（mysql_exporter / GDB exporter）───────────────────────
    - name: rdb_connections
      promql: 'max by(instance) (mysql_global_status_threads_connected)'
      threshold: 6000         # 上限 10K，常态 2K，60% 为告警
      unit: ''

    - name: qps
      promql: 'max by(instance) (rate(mysql_global_status_queries[5m]))'
      threshold: 2000
      unit: 'req/s'

    - name: tps
      promql: 'max by(instance) (rate(mysql_global_status_com_commit[5m]))'
      threshold: 100          # 常态 <10，100 为告警线
      unit: 'tx/s'

    - name: replication_lag_sec
      promql: 'max by(instance) (mysql_slave_status_seconds_behind_master)'
      threshold: 1            # 非批处理 <1s；批处理期间放宽见 batch_windows
      unit: 's'

    - name: dbproxy_slow_queries
      promql: 'sum by(instance) (increase(mysql_global_status_slow_queries[5m]))'
      threshold: 2000         # 正常时段 ≤2000；批处理期间激增属已知现象
      unit: ''

    # ── 集群健康 ────────────────────────────────────────────────────────
    - name: instance_up
      promql: 'up{job=~"gdb.*|mysql.*|node.*"}'
      threshold: 1
      unit: ''
      anomaly_when: lt        # 任意实例 down 即异常
      component: system
      severity: critical

    - name: emergency_alerts
      promql: 'sum(gdb_alert_count{severity="critical"}) or vector(0)'
      threshold: 0            # 紧急告警必须为 0
      unit: ''
      anomaly_when: gt
      component: system
      severity: critical

    # ── GDB 组件存活（v1.5.0，需 GDB Prometheus exporter）──────────────
    - name: gdb_omm_up
      promql: 'min(gdb_omm_health_status) or vector(0)'
      threshold: 1
      anomaly_when: lt
      unit: ''
      component: omm
      severity: critical
      description: 'OMM 主控节点存活状态（1=正常）'
      faq: "1. systemctl status gdb-omm\n2. 检查 /var/log/gdb/omm.log 最后50行\n3. 联系 GDB DBA"

    - name: gdb_mds_up
      promql: 'min(gdb_mds_health_status) or vector(0)'
      threshold: 1
      anomaly_when: lt
      unit: ''
      component: mds
      severity: critical
      description: 'MDS 元数据服务存活状态（1=正常）'
      faq: "1. systemctl status gdb-mds\n2. 检查 MDS 端口（默认 9000）是否监听\n3. netstat -tlnp | grep 9000"

    - name: gdb_cm_up
      promql: 'min(gdb_cm_health_status) or vector(0)'
      threshold: 1
      anomaly_when: lt
      unit: ''
      component: cm
      severity: critical
      description: 'CM 集群管理服务存活状态（1=正常）'
      faq: "1. systemctl status gdb-cm\n2. 检查心跳日志 /var/log/gdb/cm.log"

    - name: gdb_pm_up
      promql: 'min(gdb_pm_health_status) or vector(0)'
      threshold: 1
      anomaly_when: lt
      unit: ''
      component: pm
      severity: critical
      description: 'PM 分区管理服务存活状态（1=正常）'
      faq: "1. systemctl status gdb-pm\n2. 检查分区日志 /var/log/gdb/pm.log"

    - name: gdb_dbproxy_up
      promql: 'min(gdb_dbproxy_health_status) or vector(0)'
      threshold: 1
      anomaly_when: lt
      unit: ''
      component: dbproxy
      severity: critical
      description: 'DBProxy 数据库代理存活状态（1=正常）'
      faq: "1. systemctl status gdb-dbproxy\n2. netstat -tlnp | grep 3306\n3. 检查 /var/log/gdb/dbproxy.log"

    # ── GTM 主备延迟 & 副本健康 ─────────────────────────────────────────
    - name: gdb_gtm_replication_lag_sec
      promql: 'max(gdb_gtm_standby_lag_seconds) or vector(0)'
      threshold: 5
      anomaly_when: gt
      unit: 's'
      component: gtm
      severity: critical
      description: 'GTM 主备延迟（秒），期望 <5s'
      faq: "1. 检查 GTM standby 节点网络带宽\n2. 批处理窗口内延迟可放宽至 60s\n3. 查看 /var/log/gdb/gtm.log"

    - name: gdb_pm_replica_factor
      promql: 'min(gdb_pm_partition_replica_count) or vector(3)'
      threshold: 3
      anomaly_when: lt
      unit: ''
      component: pm
      severity: warning
      description: '各分区最小副本数（期望 ≥ 3）'
      faq: "副本数不足说明有 RDB 节点不可用，需排查对应 RDB 日志并联系 DBA"

    - name: gdb_rdb_sync_lag_sec
      promql: 'max(gdb_rdb_replication_lag_seconds) or vector(0)'
      threshold: 10
      anomaly_when: gt
      unit: 's'
      component: rdb
      severity: warning
      description: 'RDB 节点间同步延迟（秒），期望 <10s'
      faq: "1. 检查 RDB 节点间网络带宽\n2. 查看 /var/log/gdb/rdb.log 的 SYNC 相关日志"

    # ── DBProxy 性能 & 备份进程 ──────────────────────────────────────────
    - name: gdb_dbproxy_conn_pool_usage
      promql: 'max(gdb_dbproxy_active_connections / gdb_dbproxy_max_connections) or vector(0)'
      threshold: 0.8
      anomaly_when: gt
      unit: 'ratio'
      component: dbproxy
      severity: warning
      description: 'DBProxy 连接池使用率，期望 <80%'
      faq: "1. 查看 DBProxy 连接来源分布\n2. 检查是否有连接泄漏（长时间 sleep 连接）\n3. 考虑调大 max_connections"

    - name: gdb_dbproxy_slow_query_rate
      promql: 'sum(rate(gdb_dbproxy_slow_queries_total[5m])) or vector(0)'
      threshold: 10
      anomaly_when: gt
      unit: 'q/s'
      component: dbproxy
      severity: warning
      description: 'DBProxy 慢查询速率（近5min），期望 <10 q/s'
      faq: "1. 查看 DBProxy 慢日志定位 Top-N 慢 SQL\n2. 联系 DBA 分析执行计划\n3. 批处理期间可适当放宽"

    - name: gdb_dbproxy_error_rate
      promql: 'sum(rate(gdb_dbproxy_errors_total[5m])) or vector(0)'
      threshold: 1
      anomaly_when: gt
      unit: 'err/s'
      component: dbproxy
      severity: warning
      description: 'DBProxy 每秒错误数，期望 <1 err/s'
      faq: "1. 检查 DBProxy 错误日志\n2. 确认后端 RDB 节点状态\n3. 查看客户端错误类型分布"

    - name: gdb_backup_process_running
      promql: 'up{job="arm_backup_mysql"} or vector(0)'
      threshold: 1
      anomaly_when: lt
      unit: ''
      component: backup
      severity: warning
      description: 'arm_backup_mysql 备份进程存活（1=运行中）'
      faq: "1. ps aux | grep arm_backup_mysql\n2. 检查备份任务 cron 配置\n3. 查看备份日志 /var/log/gdb/backup/\n4. 确认备份窗口是否已过"

elasticsearch:
  url: http://localhost:9200
  username_env: ES_USERNAME
  password_env: ES_PASSWORD
  kibana_url: http://localhost:5601   # 可选，配置后报告中 ES 结果自动生成 Kibana 跳转链接
  timeout_sec: 10
  queries:

    # 需人工排查的关键错误（GDB/MySQL 层）
    - name: gdb_critical_errors
      index: 'logstash-gdb-*'
      query_string: >
        "Lost connection to MySQL server" OR
        "Lock wait timeout exceeded" OR
        "Query execution was interrupted" OR
        "Deadlock found"
      time_range_hours: 24
      size: 50

    # 可忽略的已知错误（仅统计条数，不作告警依据）
    - name: gdb_known_ignorable
      index: 'logstash-gdb-*'
      query_string: '"Got packets out of order"'
      time_range_hours: 24
      size: 5
      ignorable: true             # 标记为已知噪音，报告中标注，不计入健康评分

    # 组件通用错误（MDS/CM/PM/DBProxy）
    - name: component_errors
      index: 'logstash-gdb-*'
      query_string: 'level:ERROR AND NOT "Got packets out of order"'
      time_range_hours: 6
      size: 30

llm:
  provider: anthropic
  model: claude-sonnet-4-6
  api_key_env: ANTHROPIC_API_KEY
  max_tokens: 2048
  enable_prompt_caching: true

report:
  output_dir: reports
  language: zh-CN
  filename_format: '%Y-%m-%d-%H%M.md'

# 巡检模式配置
inspection:
  step_minutes: 5     # 时间段审计模式的 Prometheus 采样步长（分钟），建议 5-15

# 批处理时间窗口（UTC 时间，需按实际环境调整）
# 凌晨 2:00-4:00 UTC 对应北京时间 10:00-12:00，请按实际批处理时间段填写
batch_windows:
  - label: 日终批处理
    start_hour: 18            # UTC 18:00 = 北京时间 02:00
    end_hour: 20              # UTC 20:00 = 北京时间 04:00
    relaxed_thresholds:
      cpu_usage: 80           # 批处理期间 CPU 允许到 80%
      replication_lag_sec: 900  # 批处理期间主备延迟允许 15 分钟
      dbproxy_slow_queries: 50000  # 批处理期间慢日志激增属已知现象

# 多机房配置（每个机房独立 Prometheus；ES 可复用全局或独立）
# 若不配置 sites，则使用上方 prometheus.url / elasticsearch.url 作为单机房运行
sites:
  - label: 东坝
    prometheus_url: http://dongba-prometheus:9090
    # es_url 不填则复用全局 elasticsearch.url
  - label: 南法信
    prometheus_url: http://nanfaxin-prometheus:9090
  - label: 合肥
    prometheus_url: http://hefei-prometheus:9090

# 通知渠道（可配置多个，按需删减）
notifiers:
  - type: dingtalk
    webhook_env: DINGTALK_WEBHOOK
    mention_all: false
  - type: feishu
    webhook_env: FEISHU_WEBHOOK

# ── Web 认证配置（v1.7.0+）────────────────────────────────────────────────────
# 首次访问 Web UI 时会引导创建管理员账号，无需手动配置 users.json
# 会话 Cookie 名称: sanssi_sid；密码使用 PBKDF2-HMAC-SHA256 (200000 轮) 哈希
# auth:
#   session_ttl_hours: 168   # 会话有效期（小时），默认 168 = 7 天
#   users_file: users.json   # 用户数据存储路径（相对项目根目录）

# ── 日志配置（v1.7.0+）───────────────────────────────────────────────────────
# 日志文件使用 RotatingFileHandler，10MB × 5 轮转，UTF-8 编码
# logging:
#   log_dir: logs            # 日志目录，默认 logs/
#   level: INFO              # 日志级别：DEBUG / INFO / WARNING / ERROR
